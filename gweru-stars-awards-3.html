function buildProgramme() {
  return SECTIONS.map((section) => ({
    ...section,
    categories: section.categories.map((entry) => {
      const raw = typeof entry === "string" ? { name: entry } : entry;
      const votable = raw.votable !== false;
      const slug = slugify(raw.name);
      const realList = NOMINEES[slug] || [];
      return {
        slug,
        name: raw.name,
        note: raw.note || null,
        votable,
        sectionId: section.id,
        sectionName: section.name,
        nominees:
          votable && DEMO_MODE
            ? SAMPLE_POOL.slice(0, 4).map((n, i) => ({
                id: `${slug}-sample-${i + 1}`,
                name: n,
                sample: true,
              }))
            : votable
              ? realList.map((n, i) => ({
                  id: `${slug}-${i + 1}`,
                  name: n,
                  sample: false,
                }))
              : [],
      };
    }),
  }));
}

   `${categorySlug}__${fingerprint}` — a repeat vote is an "update" to
   an existing doc, which the rules reject regardless of client code.
   ═══════════════════════════════════════════════════════════════════ */

(function () {
  "use strict";

  const VOTES_KEY = "gsa_votes_v1";

  /* ── Soft device fingerprint ──────────────────────────────────────
     Not tamper-proof (clearing storage or switching browser dodges
     it) — chosen deliberately over phone/OTP verification to keep
     voting frictionless. Cached so it's stable across the session. */
  const FP_KEY = "gsa_fp_v1";
  function computeFingerprint() {
    let canvasSig = "";
    try {
      const c = document.createElement("canvas");
      const ctx = c.getContext("2d");
      ctx.textBaseline = "top";
      ctx.font = "14px Arial";
      ctx.fillText("gsa-fp-\u2606-2026", 2, 2);
      canvasSig = c.toDataURL();
    } catch {
      /* canvas fingerprinting unavailable — fall back to nav/random only */
    }
    const raw = [
      navigator.userAgent,
      navigator.language,
      navigator.hardwareConcurrency,
      screen.width + "x" + screen.height,
      Intl.DateTimeFormat().resolvedOptions().timeZone,
      canvasSig,
    ].join("::");
    let hash = 0;
    for (let i = 0; i < raw.length; i++) {
      hash = (hash << 5) - hash + raw.charCodeAt(i);
      hash |= 0;
    }
    return "fp_" + Math.abs(hash).toString(36) + "_" + Date.now().toString(36).slice(-4);
  }
  function getFingerprint() {
    try {
      let fp = localStorage.getItem(FP_KEY);
      if (!fp) {
        fp = computeFingerprint();
        localStorage.setItem(FP_KEY, fp);
      }
      return fp;
    } catch {
      return computeFingerprint(); // private browsing — best effort, not persisted
    }
  }

  /* ── Local vote memory (UI convenience only — the backend will be
        the real enforcement once wired) ── */
  function loadVotes() {
    try {
      return JSON.parse(localStorage.getItem(VOTES_KEY)) || {};
    } catch {
      return {};
    }
  }
  function saveVotes(votes) {
    try {
      localStorage.setItem(VOTES_KEY, JSON.stringify(votes));
    } catch {
      /* private browsing — vote still registers server-side later */
    }
  }
  let votes = loadVotes();

  /* ── Firestore write ────────────────────────────────────────────
     Doc ID = `${categorySlug}__${fingerprint}`. Security rules only
     allow *create* on this collection, never update/delete — so a
     repeat vote from the same fingerprint (same doc ID) is rejected
     server-side as permission-denied, independent of local state. */
  async function castVote(categorySlug, nomineeId, nomineeName, categoryName, sectionName) {
    const fingerprint = getFingerprint();
    const voteId = `${categorySlug}__${fingerprint}`;
    try {
      await db.collection("votes").doc(voteId).set({
        categorySlug,
        categoryName,
        sectionName,
        nomineeId,
        nomineeName,
        fingerprint,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      return { ok: true };
    } catch (e) {
      if (e && e.code === "permission-denied") {
        const err = new Error("already-voted");
        err.code = 409;
        throw err;
      }
      throw e;
    }
  }

  /* ── Tiny DOM helpers ── */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const app = $("#app");

  function esc(s) {
    return String(s).replace(
      /[&<>"']/g,
      (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
    );
  }

  function toast(message, tone) {
    const el = document.createElement("div");
    el.setAttribute("role", "status");
    el.className =
      "fixed bottom-6 left-1/2 z-[70] -translate-x-1/2 rounded-plaque border px-5 py-3 font-body text-sm shadow-xl " +
      (tone === "gold"
        ? "border-gold/50 bg-velvet text-gold"
        : "border-crimson/50 bg-velvet text-champagne");
    el.textContent = message;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  /* ── Countdown ── */
  let countdownTimer = null;
  function startCountdown() {
    const target = new Date(EVENT.date).getTime();
    const el = $("#countdown");
    if (!el) return;
    function tick() {
      const diff = target - Date.now();
      if (diff <= 0) {
        el.innerHTML =
          '<span class="font-display text-2xl text-gold">Tonight is the night.</span>';
        clearInterval(countdownTimer);
        return;
      }
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      el.innerHTML = [
        [d, "days"],
        [h, "hrs"],
        [m, "min"],
        [s, "sec"],
      ]
        .map(
          ([v, label]) => `
          <span class="flex flex-col items-center">
            <span class="font-display text-3xl text-champagne sm:text-4xl">${String(v).padStart(2, "0")}</span>
            <span class="mt-1 font-body text-[0.62rem] uppercase tracking-caps text-smoke">${label}</span>
          </span>`
        )
        .join(
          '<span class="pb-5 font-display text-2xl text-gold/50 sm:text-3xl">·</span>'
        );
    }
    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  /* ── Scroll reveal ── */
  const io =
    "IntersectionObserver" in window
      ? new IntersectionObserver(
          (entries) =>
            entries.forEach((e) => {
              if (e.isIntersecting) {
                e.target.classList.add("is-visible");
                io.unobserve(e.target);
              }
            }),
          { threshold: 0.08 }
        )
      : null;
  function observeReveals() {
    if (!io) {
      document
        .querySelectorAll(".reveal")
        .forEach((el) => el.classList.add("is-visible"));
      return;
    }
    document.querySelectorAll(".reveal").forEach((el) => io.observe(el));
  }

  async function fetchResults() {
    const snapshot = await db.collection("votes").get();
    const rowsByCategory = {};
    // Seed every votable category/nominee at 0 so untallied nominees still show.
    ALL_CATEGORIES.forEach((cat) => {
      if (!cat.votable) return;
      rowsByCategory[cat.slug] = cat.nominees.map((n) => ({ id: n.id, name: n.name, count: 0 }));
    });
    snapshot.forEach((doc) => {
      const v = doc.data();
      const rows = rowsByCategory[v.categorySlug];
      if (!rows) return;
      let row = rows.find((r) => r.id === v.nomineeId);
      if (!row) {
        row = { id: v.nomineeId, name: v.nomineeName || v.nomineeId, count: 0 };
        rows.push(row);
      }
      row.count += 1;
    });
    Object.values(rowsByCategory).forEach((rows) => rows.sort((a, b) => b.count - a.count));
    return rowsByCategory;
  }

  function wireAdminLogin() {
    const form = $("#admin-login-form");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = $("#admin-email").value.trim();
      const password = $("#admin-password").value;
      try {
        await auth.signInWithEmailAndPassword(email, password);
        renderAdmin();
      } catch (err) {
        app.innerHTML = adminLoginView("Couldn't sign in — check your email and password.");
        wireAdminLogin();
      }
    });
  }

  async function renderAdmin() {
    const user = auth.currentUser;
    if (!user) {
      app.innerHTML = adminLoginView();
      wireAdminLogin();
      return;
    }
    app.innerHTML = adminLoadingView();
    try {
      const rowsByCategory = await fetchResults();
      app.innerHTML = adminResultsView(rowsByCategory);
      const signOutBtn = $("#admin-signout");
      if (signOutBtn) signOutBtn.addEventListener("click", () => auth.signOut().then(renderAdmin));
    } catch (err) {
      app.innerHTML = adminLoginView("Signed in, but couldn't load results. Check your Firestore rules and connection.");
      wireAdminLogin();
    }
  }

  /* ══════════════════════ VOTE HANDLING ══════════════════════ */

  function wireCategory(cat) {
    const grid = $("#nominee-grid");
    if (!grid) return;
    grid.addEventListener("click", async (e) => {
      const card = e.target.closest("[data-nominee]");
      if (!card || card.disabled) return;
      if (votes[cat.slug]) return;

      const nomineeId = card.dataset.nominee;
      const nominee = cat.nominees.find((n) => n.id === nomineeId);
      grid
        .querySelectorAll("[data-nominee]")
        .forEach((c) => ((c.disabled = true), c.setAttribute("data-state", c === card ? "voted-for" : "blocked")));

      try {
        await castVote(cat.slug, nomineeId, nominee ? nominee.name : "", cat.name, cat.sectionName);
        votes[cat.slug] = nomineeId;
        saveVotes(votes);
        card.insertAdjacentHTML(
          "beforeend",
          '<span class="seal" aria-hidden="true">✓</span>'
        );
        const status = $("#cat-status");
        if (status)
          status.textContent =
            "Your vote is sealed. Winners are announced on the night.";
        toast("Vote cast — thank you!", "gold");
      } catch (err) {
        if (err && err.code === 409) {
          votes[cat.slug] = nomineeId;
          saveVotes(votes);
          toast("You've already voted in this category.", "gold");
        } else {
          grid
            .querySelectorAll("[data-nominee]")
            .forEach((c) => ((c.disabled = false), c.setAttribute("data-state", "idle")));
          card.querySelector(".seal")?.remove();
          toast("Couldn't reach the ballot box — check your connection and try again.");
        }
      }
    });
  }

  /* ══════════════════════ ROUTER ══════════════════════ */

  function render() {
    if (countdownTimer) clearInterval(countdownTimer);
    const hash = location.hash || "#/";
    const catMatch = hash.match(/^#\/c\/([a-z0-9-]+)/);

    if (hash.startsWith("#/admin")) {
      window.scrollTo(0, 0);
      renderAdmin();
      return;
    }

    if (catMatch) {
      const cat = getCategory(catMatch[1]);
      if (cat && cat.votable) {
        app.innerHTML = categoryView(cat);
        wireCategory(cat);
        window.scrollTo(0, 0);
        observeReveals();
        return;
      }
    }

    app.innerHTML = homeView();
    startCountdown();
    observeReveals();

    /* Highlight the act chip for the section in view */
    const chipFor = (id) => document.querySelector(`[data-chip="${id}"]`);
    if ("IntersectionObserver" in window) {
      const actIo = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              document
                .querySelectorAll(".act-chip")
                .forEach((c) => c.classList.remove("is-active"));
              chipFor(e.target.id)?.classList.add("is-active");
            }
          });
        },
        { rootMargin: "-20% 0px -70% 0px" }
      );
      PROGRAMME.forEach((s) => {
        const el = document.getElementById(s.id);
        if (el) actIo.observe(el);
      });
    }
  }

  window.addEventListener("hashchange", render);
  render();
})();

</script>
</body>
</html>
